<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini chatbot clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="greeting">
            <h1>Hello, there</h1>
            <h2>How can I help you today ?</h2>
        </div>

        <div id="outerbox">
            <div class="examples" id="eg1">
                Give me a quick tour of your features.
                <span class="material-symbols-outlined icon">stadia_controller</span>
            </div>

            <div class="examples" id="eg2">
                Help me plan my day
                <span class="material-symbols-outlined icon">lightbulb</span>
            </div>

            <div class="examples" id="eg3">
                What's a one-minute mood booster?
                <span class="material-symbols-outlined icon">comedy_mask</span>
            </div>

            <div class="examples" id="eg4">
                Write a short poem about coffee
                <span class="material-symbols-outlined icon">coffee</span>
            </div>
        </div>
    </header>
    <div class="chatlist">

    </div>
    <div class="prompt">
        <form action="#" class="typing">
            <input type="text" placeholder="Enter a prompt here" class="typing-input">

           <button  id="sendd" type="button" ><span class="material-symbols-outlined">send</span></button> 
            <button id="del"><span class="material-symbols-outlined" >delete</span></i></button>
          
        </form>
    </div>

    <p id="footr">Gemini may display inaccurate information, so please double-check the responses.</p>
</body>
<script src="script2.js"></script>

</html>
